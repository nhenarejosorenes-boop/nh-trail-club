name: Validar NH Trail Club
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/dashboard-roles-navigation]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-for-build-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Comprobar acceso y métricas de entrenamiento
        run: node --experimental-strip-types --test supabase/tests/*.test.mjs
      - name: Comprobar TypeScript
        run: npx tsc --noEmit
      - name: Compilar Next.js
        run: npm run build
      - name: Comprobar lector de archivos compilado
        run: node supabase/tests/verify-activity-worker.mjs
